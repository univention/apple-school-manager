workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "webide"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_OPEN_MERGE_REQUESTS
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_TAG

include:
  - project: univention/dist/docker-services
    file: pre-commit.yml
  - project: univention/internal/ucsschool-ci-utils
    file:
      - fragments/openstack.yaml
      - fragments/appcenter.yaml
      - fragments/misc.yaml

stages:
  - lint
  - prepare
  - build
  - test
  - appcenter
  - production
  - cleanup

variables:
  APP_BASE_VERSION: "999.0.0-staging"
  APP_UCS_VERSION: "5.2"
  APP_ID: "apple-school-manager"
  APP_NAME: "5.2/$APP_ID"
  PACKAGE: "univention-apple-school-manager-connector"
  UCS_VERSION: "520"
  UCS_RELEASE: "5.2"
  SCOPE: "univention-asm"
  DEB_IMAGE: docker-registry.knut.univention.de/phahn/ucs-debbase:$UCS_VERSION
  UCSLINT_IMAGE: gitregistry.knut.univention.de/univention/ucs
  APPCENTER_CONTROL_IMAGE: "gitregistry.knut.univention.de/univention/internal/ucsschool-ci-utils/univention-appcenter-control"

run pre-commit:
  stage: lint
  extends: .pre-commit

create_app_version:
  stage: prepare
  extends: .create_app_version

._update_appcenter:
  stage: build
  extends: .update_appcenter
  needs:
    - job: create_app_version
    - job: deb_build_git
      optional: yes
    - job: deb_repo_build
      optional: yes
  before_script:
    - ls
    - "mv build-asm/*.deb appcenter/ || true"

.integration_tests:
  extends: .run_openstack_cfg
  stage: test
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: False
  variables:
    TARGET_VERSION: "5.2-1"
    OPENSTACK_CFG_FILE: ".gitlab-ci/ucsschool-singleserver.cfg"
  script:
    - mkdir results
    - !reference [.run_openstack_cfg, script]
    - .gitlab-ci/parse_junit.py
  artifacts:
    reports:
      junit: results/**/test-reports/**/*.xml

deb_build_git:
  stage: build
  image: $DEB_IMAGE
  rules:
    - if: $CI_COMMIT_TAG == null
      changes:
        - apple-school-manager/**/*
  script:
    - apt-get update
    - cd apple-school-manager
    - apt-get -q --assume-yes build-dep .
    - dpkg-buildpackage -us -uc
    - install -d -m 755 build
    - mv ../*.tar.*z ../*.dsc ../*.deb ../*.buildinfo ../*.changes build/
    - mv build "$CI_PROJECT_DIR/build-asm"
  artifacts:
    paths:
      - build-asm

.deb_repo_import:
  stage: build
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_TAG
      changes:
        - apple-school-manager/debian/changelog
  tags:
    - omar
  script:
    - >
      repo_admin.py
      -G $CI_REPOSITORY_URL
      -b $CI_COMMIT_TAG
      -P apple-school-manager
      -r ${UCS_RELEASE}-0-0
      -s $SCOPE
      -p $PACKAGE

.deb_repo_build:
  stage: build
  needs:
    - job: deb_repo_import
      artifacts: false
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_TAG
      changes:
        - apple-school-manager/debian/changelog
  tags:
    - ladda
  script:
    - >
      build-package-ng
      --no-pbuilder-update
      -r ${UCS_RELEASE}-0-0
      -s $SCOPE
      -p $PACKAGE
    - rm build-asm/* || true
    - install -d -m 755 build-asm || true
    - cp /var/univention/buildsystem2/apt/ucs_${UCS_RELEASE}-0-${SCOPE}/*/*.deb build-asm/
  artifacts:
    paths:
      - build-asm

announce_app_chat:
  stage: cleanup
  rules:
    - if: "$CI_COMMIT_TAG"
  extends: .send_chat_message
  variables:
    ALIAS: "UCS@school Team"
    DESTINATION: "#ucsschool"
    MESSAGE: "The Apple School Manager Connector app was released in version $APP_VERSION. Changes can be found in the [Changelog](https://git.knut.univention.de/univention/components/apple-school-manager/-/blob/$UCS_RELEASE/appcenter/README_UPDATE_EN?ref_type=heads)."

announce_app_mail:
  stage: cleanup
  rules:
    - if: "$CI_COMMIT_TAG"
  extends: .send_mail
  variables:
    SUBJECT: "App Release: Apple School Manager Connector"
    RECIPIENT: "app-announcement@univention.de"
  before_script:
    - |
      cat >mail.txt<< EOF
      Hello,
      the Apple School Manager Connector has been released in version ${APP_VERSION}.

      For changes, see https://git.knut.univention.de/univention/components/apple-school-manager/-/blob/$UCS_RELEASE/appcenter/README_UPDATE_EN?ref_type=heads

      Best regards

      The UCS@school Team
      EOF

do_release:
  stage: production
  extends: .do_release

check_release:
  stage: production
  needs:
    - do_release
    - create_app_version
  extends: .check_release

delete_app_version:
  stage: cleanup
  extends: .delete_app_version

ucs_test_deb_lint:
  stage: lint
  rules:
    - changes:
      - apple-school-manager/**/*
  image:
    name: $UCSLINT_IMAGE
    entrypoint: [""]
  script:
    - cd apple-school-manager && ucslint --exitcode-categories EWIS --junit-xml ucslint.xml
  artifacts:
    reports:
      junit: apple-school-manager/ucslint.xml
