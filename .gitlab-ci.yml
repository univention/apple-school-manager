workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "webide"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_OPEN_MERGE_REQUESTS
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_COMMIT_TAG

include:
  - project: univention/dev/tooling/ci-components
    file:
      - fragments/openstack.yaml
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/pre-commit@2
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/app-release@2
    inputs:
      app_id: "apple-school-manager"
      mail_sender: "ucsschool-team@univention.de"
      author_alias: "UCS@school Team"
      mail_subject: "Apple School Manager Connector update"
      changelog_link: "https://git.knut.univention.de/univention/dev/education/apple-school-manager/-/blob/5.2/appcenter/README_UPDATE_EN?ref_type=heads"
      mail_recipient: "app-announcement@univention.de"
      chat_destination: "#ucsschool"
      ucs_base_version: "5.2"
      app_staging_version: "999.0.0-staging"
  - local: /.gitlab-ci/gitlab-ci-docs.yml
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/debian-package@2
    inputs:
      ucs_base_version: "5.2"
      scope: "univention-asm"
      yaml_based_upload: false
      additional_upload_needs:
        - create_app_version

stages:
  - lint
  - prepare
  - build
  - test
  - appcenter
  - merge
  - production
  - release
  - cleanup

variables:
  DEBIAN_SOURCE_DIRECTORIES: "apple-school-manager/"
  UCSLINT_IMAGE: gitregistry.knut.univention.de/univention/dev/ucs
  DOC_NAME: "apple-school-manager-connector"

integration_tests:
  extends: .run_openstack_cfg
  stage: test
  needs:
    - create_app_version
    - update_appcenter
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: False
  variables:
    TARGET_VERSION: "5.2-4"
    OPENSTACK_CFG_FILE: ".gitlab-ci/ucsschool-singleserver.cfg"
  script:
    - mkdir results
    - !reference [.run_openstack_cfg, script]
    - .gitlab-ci/parse_junit.py
  artifacts:
    reports:
      junit: results/**/test-reports/**/*.xml

ucs_test_deb_lint:
  stage: lint
  rules:
    - changes:
      - apple-school-manager/**/*
  image:
    name: $UCSLINT_IMAGE
    entrypoint: [""]
  script:
    - cd apple-school-manager && ucslint --exitcode-categories EWIS --junit-xml ucslint.xml
  artifacts:
    reports:
      junit: apple-school-manager/ucslint.xml
