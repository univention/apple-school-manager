# Everything that builds, checks and publishes the documentation under
# 'doc/docs', plus the 'pages' job that serves the built HTML from this
# project's Pages site.
#
# The 'sphinx-docs' component brings the sphinx templates with it, pinned to a
# tag, so there is no 'univention/dev/docs/sphinx-docker' include here.
#
# 'DOC_NAME' has to stay in step with 'doc_basename' in 'doc/docs/conf.py':
# the PDF that 'docs:pdf' copies is named after it, and the theme builds the
# download link from the value in 'conf.py'.
#
# The manual is published in English under 'DOC_NAME/en' and in German under
# 'DOC_NAME/de', the same '<language>' suffix that 'conf.py' gives the base URL.
# The component builds the English one; the 'docs-de:*' jobs below build the
# German one from the same sources and the PO files in 'doc/docs/locales/de'.

include:
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/sphinx-docs@2
    inputs:
      docs_dir: "doc/docs"
      doc_target_name: "$DOC_NAME"
      doc_target_path: "$DOC_NAME/en"
      job_rules:
        - changes: &docs_changes
            - "doc/docs/**/*"
            - "apple-school-manager/debian/changelog"
      merge_rules:
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
          changes: *docs_changes
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes: *docs_changes
          when: manual
      production_rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes: *docs_changes
        - if: $CI_COMMIT_TAG
          changes: *docs_changes

# The German build reuses the component's variables and rules and overrides the
# language and the target path. There is no German link check: the translation
# keeps every link of the English source.
.docs-de:
  extends:
    - ".docs:build-env"
    - ".docs:build:true"
  stage: build
  variables:
    language: "de"
    DOC_TARGET_PATH: "$DOC_NAME/de"

docs-de:html:
  extends:
    - ".sphinx-html-template"
    - ".docs-de"

docs-de:pdf:
  extends:
    - ".sphinx-pdf-template"
    - ".docs-de"

docs-de:spelling:
  extends:
    - ".sphinx-spelling-template"
    - ".docs-de"

# One merge artifact for both languages, because docs.univention.de takes the
# whole 'out' directory of one artifact per merge request and force-pushes it to
# a branch named after this project. A second production merge request for the
# German manual would overwrite the English one. 'needs' replaces the list of
# the component instead of extending it, so the English jobs are listed again.
docs:merge:
  needs:
    - job: "docs:html"
      artifacts: true
    - job: "docs:pdf"
      artifacts: true
    - job: "docs:linkcheck"
      artifacts: false
    - job: "docs:spelling"
      artifacts: false
    - job: "docs-de:html"
      artifacts: true
    - job: "docs-de:pdf"
      artifacts: true
    - job: "docs-de:spelling"
      artifacts: false

# Publish the documentation to GitLab Pages, reusing the HTML and the PDF that
# the build jobs produced. Each rsyncs into 'out/DOC_NAME/<language>', so their
# artifacts land on top of each other and 'out/DOC_NAME' is the complete site.
# Publishing the HTML alone would leave out the PDF that every page links to.
# The site root redirects to the English manual.
#
# This is independent of 'docs:production-merge-request', which publishes to
# docs.software-univention.de.
#
# The 'pages' keyword is what makes this a Pages job, so the job name is free
# and says what the job does.
docs-pages:
  stage: production
  image: $SPHINX_BASE
  pages:
    publish: public
  needs:
    - job: "docs:html"
      artifacts: true
    - job: "docs:pdf"
      artifacts: true
    - job: "docs-de:html"
      artifacts: true
    - job: "docs-de:pdf"
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *docs_changes
  script:
    - rm -rf public
    - mv "out/$DOC_NAME" public
    - printf '<!DOCTYPE html>\n<meta http-equiv="refresh" content="0; url=en/">\n' > public/index.html
  artifacts:
    paths:
      - public
