# Everything that builds, checks and publishes the documentation under
# 'doc/docs', plus the 'pages' job that serves the built HTML from this
# project's Pages site.
#
# The 'sphinx-docs' component brings the sphinx templates with it, pinned to a
# tag, so there is no 'univention/dev/docs/sphinx-docker' include here.
#
# 'DOC_NAME' has to stay in step with 'doc_basename' in 'doc/docs/conf.py':
# the PDF that the pdf jobs copy is named after it, and the theme builds the
# download link from the value in 'conf.py'.
#
# The manual is published in English under 'DOC_NAME/en' and in German under
# 'DOC_NAME/de', the same '<language>' suffix that 'conf.py' gives the base URL.
# The component is included once per language, with the language as the suffix
# of the job prefix. Both build from the same sources; the German one adds the
# PO files in 'doc/docs/locales/de'.

include:
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/sphinx-docs@2
    inputs:
      job_prefix: "docs-en"
      docs_dir: "doc/docs"
      doc_target_name: "$DOC_NAME"
      doc_target_path: "$DOC_NAME/en"
      job_rules: &docs_job_rules
        - changes: &docs_changes
            - "doc/docs/**/*"
            - "apple-school-manager/debian/changelog"
            - ".gitlab-ci/gitlab-ci-docs.yml"
      merge_rules: &docs_merge_rules
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
          changes: *docs_changes
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes: *docs_changes
          when: manual
      production_rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes: *docs_changes
        - if: $CI_COMMIT_TAG
          changes: *docs_changes
  # No link check, the translation keeps every link of the English source. No
  # production merge request either, 'docs-en:merge' carries both languages.
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/sphinx-docs@2
    inputs:
      job_prefix: "docs-de"
      docs_dir: "doc/docs"
      doc_target_name: "$DOC_NAME"
      doc_target_path: "$DOC_NAME/de"
      job_rules: *docs_job_rules
      merge_rules: *docs_merge_rules
      linkcheck: false
      production_merge_request: false

# 'sphinx-docker' declares 'language' with a description, so the Run pipeline
# form prefills it with an empty value. That turns it into a pipeline variable,
# which overrides the 'language' of every job below, and both builds come out in
# English. A plain value is not offered in the form.
variables:
  language: ""

".docs-en:vars":
  variables:
    language: "en"

".docs-de:vars":
  variables:
    language: "de"

# Both review jobs record an environment, and the template names it after the
# branch alone, so each language gets its own name and its own link in the merge
# request.
docs-en:review:
  environment:
    name: review/docs-en/$CI_COMMIT_REF_NAME

docs-de:review:
  environment:
    name: review/docs-de/$CI_COMMIT_REF_NAME

# One artifact for both languages, because docs.univention.de takes the whole
# 'out' directory of one artifact per merge request and force-pushes it to a
# branch named after this project. A second production merge request for the
# German manual would overwrite the English one. 'needs' replaces the list of
# the component instead of extending it, so the English jobs are listed again.
docs-en:merge:
  needs:
    - job: "docs-en:html"
      artifacts: true
    - job: "docs-en:pdf"
      artifacts: true
    - job: "docs-en:linkcheck"
      artifacts: false
    - job: "docs-en:spelling"
      artifacts: false
    - job: "docs-de:html"
      artifacts: true
    - job: "docs-de:pdf"
      artifacts: true
    - job: "docs-de:spelling"
      artifacts: false

# Publish the documentation to GitLab Pages, reusing the HTML and the PDF that
# the build jobs produced. Each rsyncs into 'out/DOC_NAME/<language>', so their
# artifacts land on top of each other and 'out/DOC_NAME' is the complete site.
# Publishing the HTML alone would leave out the PDF that every page links to.
# The site root links to both languages.
#
# This is independent of 'docs-en:production-merge-request', which publishes to
# docs.software-univention.de.
#
# The 'pages' keyword is what makes this a Pages job, so the job name is free
# and says what the job does.
docs-pages:
  stage: production
  image: $SPHINX_BASE
  pages:
    publish: public
  needs:
    - job: "docs-en:html"
      artifacts: true
    - job: "docs-en:pdf"
      artifacts: true
    - job: "docs-de:html"
      artifacts: true
    - job: "docs-de:pdf"
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *docs_changes
  script:
    - rm -rf public
    - mv "out/$DOC_NAME" public
    - |
      cat > public/index.html <<'EOF'
      <!DOCTYPE html>
      <html lang="en">
      <meta charset="utf-8">
      <title>Apple School Manager Connector</title>
      <h1>Apple School Manager Connector</h1>
      <ul>
        <li><a href="en/">English</a></li>
        <li><a href="de/" lang="de">Deutsch</a></li>
      </ul>
      EOF
  artifacts:
    paths:
      - public
