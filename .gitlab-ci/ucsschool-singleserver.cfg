[Global]
parallel: true
openstack_flavor_name: UNIVENTION-4V-4-50s
extra_label: asm-branch-test-[ENV:CI_COMMIT_REF_SLUG]

[primary]
openstack_image_name: [ENV:TARGET_VERSION]-dev-ucsschool-singleserver
command1:
 . utils.sh && add_tech_key_authorized_keys
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [SELF_IP]
command2:
 . utils.sh set_administrator_dn_for_ucs_test
 . utils.sh set_administrator_password_for_ucs_test univention
 . utils.sh && switch_to_test_app_center
 . utils.sh && install_apps apple-school-manager=[ENV:APP_VERSION]
 apt-get update
 apt-get --assume-yes install ucs-test-apple-school-manager
 ucs-test -F junit -f -E dangerous -s apple-school-manager
 LOCAL /usr/lib/python3/dist-packages/univention/ec2/utils/utils-local.sh fetch-results [SELF_IP] results/[SELF]
