[Global]
parallel: true
extra_label: asm-branch-test-[ENV:CI_COMMIT_REF_SLUG]

# OpenStack settings
openstack_flavor_name: UNIVENTION-4V-4-50s

# Proxmox settings
proxmox_node: [ENV:PROXMOX_NODE]
proxmox_pool: Development
proxmox_bridge: Dev
proxmox_template_pool: Images
proxmox_vcpus: 4
proxmox_memory: 8G
proxmox_disk_size: 50G
proxmox_description: asm-branch-test-[ENV:CI_COMMIT_REF_SLUG]

[primary]
openstack_image_name: [ENV:TARGET_VERSION]-dev-ucsschool-singleserver-primary
proxmox_template: template-ucsschool-[ENV:TARGET_VERSION]-singleserver-primary
command1:
 . utils.sh && online_fsresize
 . utils.sh && add_tech_key_authorized_keys
 . utils.sh && basic_setup
 . utils.sh && basic_setup_ucs_joined [SELF_IP]
command2:
 . utils.sh && set_administrator_dn_for_ucs_test
 . utils.sh && set_administrator_password_for_ucs_test univention
 . utils.sh && switch_to_test_app_center
 . utils-school.sh && UCSSCHOOL_UPGRADE_VERSION="999.0.0-staging" upgrade_ucsschool_to_version
 . utils.sh && install_apps keycloak
 . utils.sh && install_apps apple-school-manager=[ENV:APP_VERSION]
 apt-get update
 apt-get --assume-yes install ucs-test-apple-school-manager
 ucs-test -F junit -f -E dangerous -s apple-school-manager
 LOCAL [ENV:VMUTILSPATH]/utils/utils-local.sh fetch-results [SELF_IP] results/[SELF]
