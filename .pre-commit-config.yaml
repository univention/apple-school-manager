default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^basedpyright-baseline[.]json$
      - id: check-json
      - id: check-xml
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
      - id: pretty-format-json
        args: [--autofix]
        exclude: ^basedpyright-baseline[.]json$
  - repo: https://git.knut.univention.de/univention/dist/pre-commit-ucr
    rev: "0.1.7"
    hooks:
      - id: ucr-ruff-fix
        additional_dependencies: ["ruff==0.11.0"]
      - id: ucr-ruff-format
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "v0.15.0"
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-check
        alias: "ruff-unsafe"
        stages: [manual]
        args: ["--fix", "--unsafe-fixes"]
  - repo: local
    hooks:
      - id: basedpyright-container-baseline
        name: basedpyright (relative to baseline)
        language: docker_image
        entry: |
          gitregistry.knut.univention.de/univention/dev/education/ucsschool/basedpyright-ucs@sha256:ea4e4e4c69cd2541b59cf8ae0536bad70624f540910e4e210d184dda675f245f sh -c '
          basedpyright \
            --pythonpath /usr/bin/python3 \
            --project pyrightconfig.json \
            --baselinefile basedpyright-baseline.json \
            --baselinemode=auto' --
        pass_filenames: false
        types: [python]

      - id: basedpyright-native-baseline
        name: basedpyright (relative to baseline, native)
        language: system
        entry: |
          sh -c 'basedpyright \
            --pythonpath /usr/bin/python3 \
            --project pyrightconfig.json \
            --baselinefile basedpyright-baseline.json \
            --baselinemode=auto' --
        stages: [manual]
        pass_filenames: false
        types: [python]

      - id: basedpyright-container-no-baseline
        name: basedpyright (lint file, no baseline)
        language: docker_image
        entry: |
          gitregistry.knut.univention.de/univention/dev/education/ucsschool/basedpyright-ucs@sha256:ea4e4e4c69cd2541b59cf8ae0536bad70624f540910e4e210d184dda675f245f sh -c '
          basedpyright \
            --pythonpath /usr/bin/python3 \
            --project pyrightconfig.json \
            --baselinefile /tmp/nonexistent-basedpyright-baseline.json' --
        stages: [manual]
        pass_filenames: true
        types: [python]

      - id: basedpyright-container-write-baseline
        name: basedpyright (write baseline)
        language: docker_image
        entry: |
          gitregistry.knut.univention.de/univention/dev/education/ucsschool/basedpyright-ucs@sha256:ea4e4e4c69cd2541b59cf8ae0536bad70624f540910e4e210d184dda675f245f sh -c '
          basedpyright \
            --pythonpath /usr/bin/python3 \
            --project pyrightconfig.json \
            --baselinefile basedpyright-baseline.json \
            --writebaseline .' --
        stages: [manual]
        pass_filenames: false
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://git.knut.univention.de/univention/dist/pre-commit-debian.git
    rev: v1.1.0
    hooks:
      - id: debian-control
      - id: debian-changelog

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.35
    hooks:
      - id: pymarkdown
        args:
          - --disable-rules
          - MD013,MD024,MD034
          - scan
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
        args: ["--strict"]
  - repo: local
    hooks:
      - id: issue-reference
        stages: [ commit-msg ]
        name: issue-reference
        language: pygrep
        entry: '.*\n(\n(Issue ([a-zA-Z_/-]+)#\d+|Bug #\d+))+\n?(\n#.*)*\Z'
        args: ["--multiline", "--negate"]
  - repo: https://git.knut.univention.de/univention/infrastructure/pre-commit-hooks/pre-commit-copyright
    rev: 0.2.0
    hooks:
      - id: reuse-toml-dry-run
      - id: reuse-toml
        stages: [ manual ]
      - id: update-copyright-year
        stages: [ manual ]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        alias: reuse-annotate
        name: "reuse annotate"
        args: ["annotate", "-c", "Univention GmbH", "-l", "AGPL-3.0-only", "--skip-unrecognised", "--skip-existing", "--template", "univention"]
        pass_filenames: true
        description: "Annotate all unlicensed files as AGPL-3.0-only with Univention GmbH copyright"
        stages: [ manual ]
      - id: reuse
        alias: reuse-lint
        stages: [ manual ]
      - id: reuse-lint-file
default_language_version:
  python: python3.11
