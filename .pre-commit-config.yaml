default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-xml
      - id: check-yaml
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
      - id: pretty-format-json
        args: [--autofix]
  - repo: https://git.knut.univention.de/univention/dist/pre-commit-ucr
    rev: "0.1.0"
    hooks:
      - id: ucr-ruff-fix
        additional_dependencies: ["ruff==0.11.0"]
      - id: ucr-ruff-format
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "v0.11.0"
    hooks:
      - id: ruff-format
      - id: ruff
        args: ["--fix"]
      - id: ruff
        alias: "ruff-unsafe"
        stages: [manual]
        args: ["--fix", "--unsafe-fixes"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: ["types-paramiko"]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: https://git.knut.univention.de/univention/dist/pre-commit-debian.git
    rev: v1.1.0
    hooks:
      - id: debian-control
      - id: debian-changelog

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.29
    hooks:
      - id: pymarkdown
        args:
          - --disable-rules
          - MD013,MD024,MD034
          - scan
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
        args: ["--strict"]
  - repo: local
    hooks:
      - id: issue-reference
        stages: [ commit-msg ]
        name: issue-reference
        language: pygrep
        entry: '.*\n\n(Issue \w+(/\w+)*#\d+|Bug #\d+)\n+(\n.*)*\Z'
        args: ["--multiline", "--negate"]
default_language_version:
  python: python3.11
